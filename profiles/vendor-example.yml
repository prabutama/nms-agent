name: example-default
match:
  vendor: example
  model: ""

metrics:
  - metric: snmp.uptime_seconds
    oid: 1.3.6.1.2.1.1.3.0
    type: get
    unit: s

  - metric: snmp.if.oper_status
    oid: 1.3.6.1.2.1.2.2.1.8
    type: walk
    index: true

  - metric: snmp.host.memory.size_kb
    oid: 1.3.6.1.2.1.25.2.2.0
    type: get
    unit: kB
