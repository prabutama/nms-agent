name: standard
match:
  vendor: ""
  model: ""

metrics:
  - metric: snmp.uptime_seconds
    oid: 1.3.6.1.2.1.1.3.0
    type: get
    unit: s

  - metric: snmp.if.oper_status
    oid: 1.3.6.1.2.1.2.2.1.8
    type: walk
    index: true

  - metric: snmp.if.in_octets
    oid: 1.3.6.1.2.1.31.1.1.1.6
    type: walk
    unit: octets
    index: true

  - metric: snmp.if.out_octets
    oid: 1.3.6.1.2.1.31.1.1.1.10
    type: walk
    unit: octets
    index: true
