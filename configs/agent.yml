agent:
  env_file: local.env
  poll_interval: 10s
  output:
    timezone: UTC+7
  delivery:
    max_batch: 200
    drain_enabled: true
    max_batches_per_cycle: 20
    stop_on_error: true

paths:
  devices_dir: devices.d
  thresholds_file: thresholds.yml
  adapters_file: adapters.yml
  nms_agent_db: ../data/nms-agent.db
  profiles_dir: ../profiles
  view_socket: ../data/view.sock
