agent:
  # Polling interval used by the agent loop (future use).
  poll_interval: 60s

  # Presentation timezone for adapter output only (canonical telemetry is still stored as UTC instants).
  output:
    timezone: UTC+7

  # Queue delivery loop configuration.
  delivery:
    max_batch: 200
    drain_enabled: true
    max_batches_per_cycle: 20
    stop_on_error: true

paths:
  devices_dir: devices.d
  thresholds_file: thresholds.yml
  adapters_file: adapters.yml
  queue_db: data/queue/queue.db
