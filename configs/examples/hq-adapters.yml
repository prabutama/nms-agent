# HQ Site — ThingsBoard MQTT Adapter (Gateway Mode)
# Publish ThingsBoard-shaped telemetry to a local broker for
# ThingsBoard Gateway MQTT connector consumption.

adapters:
  active: thingsboard_mqtt
  configs:
    broker: tcp://127.0.0.1:1883
    mode: gateway
    topic: nms-agent/thingsboard/telemetry
    strict_queue_mode: true
