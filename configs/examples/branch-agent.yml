# Branch Site — Branch Office Monitoring
# Deploy this config on the gateway at each branch office.

agent:
  poll_interval: 120s
  output:
    timezone: UTC+7
  delivery:
    max_batch: 100
    drain_enabled: true
    max_batches_per_cycle: 10
    stop_on_error: true

paths:
  devices_dir: devices.d
  thresholds_file: thresholds.yml
  adapters_file: adapters.yml
  queue_db: data/queue/queue.db
