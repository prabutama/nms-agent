# Branch Site — Threshold Rules
# Simplified thresholds for branch office monitoring.

thresholds:
  # ICMP reachability
  - metric: icmp.latency_ms
    operator: ">"
    warning: 100
    critical: 200
    tags:
      source: icmp

  - metric: icmp.packet_loss_pct
    operator: ">"
    warning: 5
    critical: 15
    tags:
      source: icmp

  # Interface operational status
  - metric: snmp.if.oper_status
    operator: "=="
    warning: 2
    tags:
      ifIndex: "*"

  # Interface utilization (higher thresholds for branch)
  - metric: snmp.if.rx_utilization_pct
    operator: ">"
    warning: 80
    critical: 95
    tags:
      ifIndex: "*"

  - metric: snmp.if.tx_utilization_pct
    operator: ">"
    warning: 80
    critical: 95
    tags:
      ifIndex: "*"
