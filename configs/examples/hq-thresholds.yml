# HQ Site — Threshold Rules
# Defines warning and critical thresholds for monitored metrics.

thresholds:
  # ICMP reachability
  - metric: icmp.latency_ms
    operator: ">"
    warning: 50
    critical: 100
    tags:
      source: icmp

  - metric: icmp.packet_loss_pct
    operator: ">"
    warning: 1
    critical: 5
    tags:
      source: icmp

  # Interface operational status
  - metric: snmp.if.oper_status
    operator: "=="
    warning: 2
    tags:
      ifIndex: "*"

  # Interface utilization
  - metric: snmp.if.rx_utilization_pct
    operator: ">"
    warning: 70
    critical: 90
    tags:
      ifIndex: "*"

  - metric: snmp.if.tx_utilization_pct
    operator: ">"
    warning: 70
    critical: 90
    tags:
      ifIndex: "*"

  # Host resources
  - metric: snmp.host.cpu.load_pct
    operator: ">"
    warning: 80
    critical: 95
    tags:
      source: cpu

  - metric: snmp.host.memory.used_pct
    operator: ">"
    warning: 85
    critical: 95
    tags:
      source: memory
